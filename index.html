
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="clock-card">
        <p class="eyebrow">LOCAL TIME</p>
        <h1>Digital Clock</h1>

        <div id="clockDisplay" class="clock"></div>

        <section class="date-panel">
            <span class="date-label">TODAY</span>
            <p id="dayDisplay" class="day"></p>
            <p id="dateDisplay" class="date"></p>
        </section>

        <div class="controls">
            <button id="formatToggle">Switch to 24-hour</button>
            <button id="themeToggle">Light theme</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
